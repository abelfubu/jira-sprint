name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: JIRA_SPRINT_SELF_TEST=1 .build/debug/JiraSprint
      - name: Package universal app
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Jira-Sprint-*.zip dist/Jira-Sprint-*.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Jira-Sprint-*.zip dist/Jira-Sprint-*.zip.sha256 --generate-notes
          fi
      - name: Request Homebrew cask update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/abelfubu/homebrew-tap/dispatches \
            --method POST \
            -f event_type=update-cask \
            -f "client_payload[cask]=jira-sprint" \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"
